name: Build TWRP Ramdisk - RMX3660

on:
  workflow_dispatch:

jobs:

  build:

    name: TWRP Ramdisk - Realme 10 Pro
    runs-on: ubuntu-24.04

    env:
      DEVICE: luigi
      DEVICE_PATH: device/realme/luigi

    steps:

      # ============================================
      # Checkout builder
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      # ============================================
      # Install dependencies
      # ============================================

      - name: Install dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2-utils \
            lz4 \
            lzop \
            rsync \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev


      # ============================================
      # Install repo
      # ============================================

      - name: Install repo
        run: |

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"


      # ============================================
      # Git configuration
      # ============================================

      - name: Configure git
        run: |

          git config --global user.name \
            "GitHub Actions"

          git config --global user.email \
            "actions@github.com"


      # ============================================
      # Initialize TWRP
      # ============================================

      - name: Initialize TWRP
        run: |

          mkdir -p android

          cd android

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1


      # ============================================
      # Sync TWRP
      # ============================================

      - name: Sync TWRP
        run: |

          cd android

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2


      # ============================================
      # Create device directory
      # ============================================

      - name: Create TWRP device tree
        run: |

          mkdir -p \
            android/device/realme/luigi/prebuilt


      # ============================================
      # Install TWRP device files
      # ============================================

      - name: Install TWRP configuration
        run: |

          cp \
            recovery/twrp/luigi/AndroidProducts.mk \
            android/device/realme/luigi/

          cp \
            recovery/twrp/luigi/twrp_luigi.mk \
            android/device/realme/luigi/

          cp \
            recovery/twrp/luigi/BoardConfig.mk \
            android/device/realme/luigi/

          cp \
            recovery/twrp/luigi/device.mk \
            android/device/realme/luigi/


      # ============================================
      # Install stock kernel
      # ============================================

      - name: Install stock kernel
        run: |

          test -f prebuilt/kernel

          cp \
            prebuilt/kernel \
            android/device/realme/luigi/prebuilt/kernel

          chmod 644 \
            android/device/realme/luigi/prebuilt/kernel

          ls -lh \
            android/device/realme/luigi/prebuilt/kernel


      # ============================================
      # Create basic recovery fstab
      # ============================================

      - name: Create recovery fstab
        run: |

          cat > android/device/realme/luigi/recovery.fstab <<'EOF'

          /dev/block/bootdevice/by-name/boot \
              /boot \
              emmc \
              flags=slotselect

          /dev/block/bootdevice/by-name/misc \
              /misc \
              emmc

          /dev/block/bootdevice/by-name/dtbo \
              /dtbo \
              emmc

          EOF


      # ============================================
      # Verify device tree
      # ============================================

      - name: Verify configuration
        run: |

          cd android

          echo "========================================"
          echo "RMX3660 TWRP CONFIGURATION"
          echo "========================================"

          ls -lah device/realme/luigi

          echo
          echo "AndroidProducts.mk:"
          cat device/realme/luigi/AndroidProducts.mk

          echo
          echo "twrp_luigi.mk:"
          cat device/realme/luigi/twrp_luigi.mk

          echo
          echo "Kernel:"
          ls -lh device/realme/luigi/prebuilt/kernel


      # ============================================
      # Setup build environment
      # ============================================

      - name: Setup build environment
        run: |

          cd android

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh


      # ============================================
      # Lunch
      # ============================================

      - name: Lunch TWRP
        run: |

          cd android

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch twrp_luigi-eng


      # ============================================
      # Build TWRP boot image
      # ============================================

      - name: Build TWRP boot image
        run: |

          cd android

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch twrp_luigi-eng

          mka bootimage


      # ============================================
      # Locate generated boot image
      # ============================================

      - name: Locate TWRP boot image
        run: |

          cd android

          find out/target/product/luigi \
            -type f \
            -name "boot.img" \
            -print


      # ============================================
      # Extract ramdisk
      # ============================================

      - name: Extract TWRP ramdisk
        run: |

          mkdir -p output

          BOOT="android/out/target/product/luigi/boot.img"

          test -f "$BOOT"

          echo "Generated TWRP boot image:"
          ls -lh "$BOOT"

          mkdir -p ramdisk_extract

          python3 system/tools/mkbootimg/unpack_bootimg.py \
            --boot_img "$BOOT" \
            --out ramdisk_extract

          echo
          echo "Unpacked files:"
          ls -lah ramdisk_extract


      # ============================================
      # Locate ramdisk
      # ============================================

      - name: Locate generated ramdisk
        run: |

          find ramdisk_extract \
            -type f \
            -name "*ramdisk*" \
            -print


      # ============================================
      # Create ramdisk.cpio
      # ============================================

      - name: Create ramdisk.cpio
        run: |

          cd ramdisk_extract

          if [ -d "ramdisk" ]; then

            cd ramdisk

            find . -print0 | \
              cpio --null \
              -o \
              -H newc \
              > "${GITHUB_WORKSPACE}/output/ramdisk.cpio"

          elif [ -f "ramdisk" ]; then

            cp \
              ramdisk \
              "${GITHUB_WORKSPACE}/output/ramdisk.cpio"

          elif [ -f "ramdisk.cpio" ]; then

            cp \
              ramdisk.cpio \
              "${GITHUB_WORKSPACE}/output/ramdisk.cpio"

          else

            echo "ERROR: TWRP ramdisk was not found."

            exit 1

          fi


      # ============================================
      # Verify ramdisk
      # ============================================

      - name: Verify ramdisk
        run: |

          test -f output/ramdisk.cpio

          echo
          echo "========================================"
          echo "TWRP RAMDISK"
          echo "========================================"

          ls -lh output/ramdisk.cpio

          file output/ramdisk.cpio

          echo
          echo "CPIO header:"

          od \
            -An \
            -tx1 \
            -N6 \
            output/ramdisk.cpio


      # ============================================
      # Build information
      # ============================================

      - name: Create build information
        run: |

          cat > output/build-info.txt <<'EOF'
          Device: Realme 10 Pro
          Model: RMX3660
          Codename: luigi

          Recovery: TWRP
          Output: ramdisk.cpio

          Kernel:
          Stock RMX3660 kernel

          TWRP source:
          minimal-manifest-twrp/platform_manifest_twrp_aosp

          Branch:
          twrp-12.1

          Data decryption:
          Disabled

          IMPORTANT:
          This file contains the TWRP ramdisk only.
          It is not a complete boot.img.
          EOF


      # ============================================
      # Upload artifact
      # ============================================

      - name: Upload TWRP ramdisk
        uses: actions/upload-artifact@v4
        with:
          name: RMX3660-TWRP-Ramdisk
          path: output/
          if-no-files-found: error
